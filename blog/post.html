<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Post</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body id="site">

<nav>
  <span class="nav-logo">raiya.dev/blog</span>
  <ul class="nav-links">
    <li><a href="index.html">← Blog</a></li>
    <li><a href="../index.html">Home</a></li>
  </ul>
</nav>

<section id="post-container"></section>

<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const weekId = params.get("week");
  const postSlug = params.get("post");
  console.log({ weekId, postSlug });

  const res = await fetch("./generated/index.json");
  const data = await res.json();

  const week = data.weeks.find(w => w.id === weekId);
  const post = week.posts.find(p => p.slug === postSlug);

  const container = document.getElementById("post-container");

  const sourceSection = post.sourceUrl
    ? `
      <hr class="post-divider">

      <div class="post-source">
        <div class="section-label">Sources:</div>

        <a
          href="${post.sourceUrl}"
          target="_blank"
          rel="noopener noreferrer"
          class="source-link"
        >
          ${post.sourceUrl}
        </a>
      </div>
    `
    : "";


  container.innerHTML = `
    <h2 class="section-title">${post.title}</h2>

    <p class="post-summary">
      ${post.summary}
    </p>

    <div class="post-meta">
      <span>${new Date(post.date).toLocaleDateString("en-CA", {
        year: "numeric",
        month: "long",
        day: "numeric"
      })}</span>
      <span>·</span>
      <span>${post.author}</span>
      <span>·</span>
      <span>${post.source}</span>
      <span>
    </div>

    <div class="post-content">
      ${marked.parse(post.content)}
    </div>
    ${sourceSection}
`;
}

window.addEventListener("DOMContentLoaded", loadPost);
</script>

</body>
</html>
