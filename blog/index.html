<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Raiya — Blog</title>
  <link rel="stylesheet" href="../styles.css">

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body id="site">

<nav>
  <span class="nav-logo">raiya.dev/blog</span>
  <ul class="nav-links">
    <li><a href="../index.html">Home</a></li>
  </ul>
</nav>

<section>

  <!-- HEADER -->
  <div class="section-label">Blog</div>
  <h2 class="section-title">Writing on security, systems, and cloud engineering</h2>

  <div id="blog-container"></div>
</section>

<script>
async function loadBlog() {
  const res = await fetch("./generated/index.json");
  const data = await res.json();

  const container = document.getElementById("blog-container");

  const weeks = [...data.weeks].reverse();

  weeks.forEach((week, wi) => {

    container.innerHTML += `
      <div class="section-label">${week.week}</div>
      <div class="projects-grid" id="week-${wi}"></div>
    `;

    const weekContainer = document.getElementById(`week-${wi}`);

    week.posts.forEach(post => {

      weekContainer.innerHTML += `
        <div class="project-card"
          onclick="openPost('${week.id}', '${post.slug}')"
          style="cursor:pointer">

          <span class="project-cat">${post.category}</span>
          <div class="project-name">${post.title}</div>

          <p class="project-desc">${post.summary}</p>

          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${post.tags.map(t => `<span class="tech-tag">${t}</span>`).join("")}
          </div>

        </div>
      `;
    });
  });

  window.__blogData = data;
}

function openPost(weekId, postSlug) {
  window.location.href = `post.html?week=${weekId}&post=${postSlug}`;
}

window.addEventListener("DOMContentLoaded", loadBlog);
</script>

</body>
</html>
