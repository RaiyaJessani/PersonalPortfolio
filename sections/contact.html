<section id="contact" style="border-top:1px solid var(--border)">
    <div class="section-label">07 — Contact</div>
    <h2 class="section-title">Let's connect</h2>
    <div class="contact-grid">
        <div class="contact-info">
        <div class="contact-name">Raiya Jessani</div>
        <span class="contact-role">Security & Cloud Engineer</span>
        <p class="contact-bio">I'm open to full-time roles and internships in security engineering and cloud. Drop me a line — I read everything.</p>
        <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--purple-dim);margin-bottom:20px">rijessan@uwaterloo.ca</p>
        <div class="social-row">
            <a href="https://linkedin.com/in/raiya-jessani" target="_blank"><button class="social-btn" aria-label="LinkedIn"><i class="ti ti-brand-linkedin" aria-hidden="true"></i></button></a>
            <a href="https://github.com/RaiyaJessani" target="_blank"><button class="social-btn" aria-label="GitHub"><i class="ti ti-brand-github" aria-hidden="true"></i></button></a>
